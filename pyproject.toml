[build-system]
requires = ["setuptools", "wheel"]

[tool.ruff]
line-length = 120
target-version = "py311"
ignore = ["B008"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "RET", # flake8-return
    "SIM", # flake8-simplify
]

exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "env",
    "venv",
    "build",
    "dist",
    "alembic"
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/migrations/*" = ["F401"]
"*/tests/*" = ["S101"]
